<html class="no-js" lang="en">

<head>

    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="House of Nkile Fashion Shop">

    <title>Shop - House of Nkile</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- HEADER -->
    <header>

        <h1>Shop</h1>

        <nav>

            <a href="index.html">Home</a>

            <a href="about-us.html">About Us</a>

            <a href="contact-us.html">Contact Us</a>

            <a href="shop.html">Shop</a>

            <a href="feedback.html">Feedback</a>

            <a href="login.html">Login</a>

        </nav>

    </header>


    <!-- BOOTSTRAP CAROUSEL -->

    <div id="fashionCarousel"
        class="carousel slide"
        data-bs-ride="carousel">

        <!-- INDICATORS -->
        <div class="carousel-indicators">

            <button type="button"
                data-bs-target="#fashionCarousel"
                data-bs-slide-to="0"
                class="active"
                aria-current="true"
                aria-label="Slide 1">
            </button>

            <button type="button"
                data-bs-target="#fashionCarousel"
                data-bs-slide-to="1"
                aria-label="Slide 2">
            </button>

            <button type="button"
                data-bs-target="#fashionCarousel"
                data-bs-slide-to="2"
                aria-label="Slide 3">
            </button>

        </div>


        <!-- SLIDES -->
        <div class="carousel-inner">

            <div class="carousel-item active">

                <img src="images/boots.jpg"
                    class="d-block w-100"
                    alt="Boots">

            </div>

            <div class="carousel-item">

                <img src="images/sandals.jpg"
                    class="d-block w-100"
                    alt="Sandals">

            </div>

            <div class="carousel-item">

                <img src="images/off-shoulderdress.jpg"
                    class="d-block w-100"
                    alt="Off-shoulder Dress">

            </div>

        </div>


        <!-- PREVIOUS BUTTON -->
        <button class="carousel-control-prev"
            type="button"
            data-bs-target="#fashionCarousel"
            data-bs-slide="prev">

            <span class="carousel-control-prev-icon"
                aria-hidden="true">
            </span>

            <span class="visually-hidden">
                Previous
            </span>

        </button>


        <!-- NEXT BUTTON -->
        <button class="carousel-control-next"
            type="button"
            data-bs-target="#fashionCarousel"
            data-bs-slide="next">

            <span class="carousel-control-next-icon"
                aria-hidden="true">
            </span>

            <span class="visually-hidden">
                Next
            </span>

        </button>

    </div>


    <!-- PRODUCTS SECTION -->

    <section class="products">

        <h2>Featured Products</h2>

        <div class="grid">

            <div class="item">

                <img src="images/dress1.jpg" alt="Dress">

                <p>Elegant Dress - P300</p>

            </div>


            <div class="item">

                <img src="images/top1.jpg" alt="Top">

                <p>Classic Crop Top - P190</p>

            </div>


            <div class="item">

                <img src="images/blazer.jpg" alt="Blazer">

                <p>Casual Blazer - P400</p>

            </div>


            <div class="item">

                <img src="images/heels.jpg" alt="Heels">

                <p>High Heels - P380</p>

            </div>

        </div>

    </section>


    <!-- FOOTER -->

    <footer>

        <p>© 2026 House of Nkile</p>

    </footer>


    <!-- Bootstrap JavaScript -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
    </script>

</body>

</html>
